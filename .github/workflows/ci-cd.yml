# CI/CD pipeline for Footynet
#
# CI (on every push and pull request to main):
#   backend  -> restore, build and run the xUnit tests in Footynet/Footynet.Tests
#   frontend -> install, lint, type-check and build the Next.js app
#   docker   -> build the backend Docker image to prove the Dockerfile works
#
# CD (only on push to main, and only if every CI job passed):
#   deploy   -> trigger a Render deploy through a deploy hook URL stored as a GitHub secret.
#               The frontend is deployed by Vercel itself once the repo is connected there.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch cancels the run that is still in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend – build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Footynet
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Footynet.sln

      - name: Build
        run: dotnet build Footynet.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Footynet.sln --configuration Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: Footynet/TestResults

  frontend:
    name: Frontend – lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: footynet-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: footynet-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5067/api

  docker:
    name: Backend – Docker image
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t footynet-api:${{ github.sha }} Footynet

  deploy:
    name: Deploy backend (Render)
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_URL secret is not set yet – skipping deploy."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Render deploy triggered."
